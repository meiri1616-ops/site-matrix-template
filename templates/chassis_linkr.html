<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BRAND_NAME}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-slate-900 via-purple-950 to-slate-900 min-h-screen text-white flex flex-col items-center justify-between p-4 antialiased">
    <div class="w-full max-w-md mx-auto pt-12 pb-8 flex flex-col items-center text-center">
        <!-- 头像与主标 -->
        <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-1 mb-4 shadow-xl shadow-purple-500/20">
            <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                {{AVATAR_INITIAL}}
            </div>
        </div>
        <h1 class="text-2xl font-black mb-1 tracking-tight">{{BRAND_NAME}}</h1>
        <p class="text-sm text-purple-200/80 mb-6 font-medium">{{TAGLINE}}</p>
        
        <!-- 多语言选装 -->
        {{LANG_BAR_HTML}}

        <!-- 胶囊链接矩阵 -->
        <div class="w-full space-y-3.5 mb-8">
            {{SERVICES_CARDS_HTML}}
        </div>

        <!-- 收款与联系 -->
        <div class="w-full space-y-3">
            {{PAYMENT_BUTTON_HTML}}
            <div class="flex items-center justify-center gap-3 pt-4">
                {{CONTACT_BADGES_HTML}}
            </div>
        </div>
    </div>
    
    <footer class="pb-6 text-xs text-purple-300/40">
        © 2026-2027 {{BRAND_NAME}} · Built on Modular Matrix
    </footer>
</body>
</html>
