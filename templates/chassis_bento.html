<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BRAND_NAME}} - {{TAGLINE}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 antialiased selection:bg-purple-500">
    <div class="max-w-4xl mx-auto pt-6 pb-12">
        <!-- 头部 Bento 卡片 -->
        <div class="p-8 sm:p-10 rounded-3xl bg-slate-900/80 border border-slate-800 backdrop-blur-xl mb-6 shadow-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
            <div>
                <span class="inline-block px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-semibold mb-3">
                    {{TAGLINE}}
                </span>
                <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white mb-2">{{HERO_TITLE}}</h1>
                <p class="text-sm sm:text-base text-slate-400 max-w-xl">{{HERO_DESC}}</p>
            </div>
            <div class="w-full sm:w-auto flex sm:flex-col gap-2">
                {{LANG_BAR_HTML}}
            </div>
        </div>

        <!-- 便当网格核心矩阵 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
            {{SERVICES_CARDS_HTML}}
        </div>

        <!-- 底部大卡片 (收银 + 联系) -->
        <div class="p-8 rounded-3xl bg-gradient-to-r from-purple-900/40 to-slate-900 border border-purple-500/20 flex flex-col sm:flex-row items-center justify-between gap-6">
            <div>
                <h3 class="text-xl font-bold mb-1">即刻建立连接</h3>
                <p class="text-xs text-slate-400">选择您最偏好的沟通或支付渠道</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                {{PAYMENT_BUTTON_HTML}}
                {{CONTACT_BADGES_HTML}}
            </div>
        </div>
    </div>
</body>
</html>
